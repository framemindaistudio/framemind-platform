<title>Brand Stories in 3D · FrameMind</title>
<style>
@font-face{font-family:"Hanken Grotesk";src:url("assets/HankenGroteskwght.ttf");font-weight:100 900;font-display:swap}@font-face{font-family:"Young Serif";src:url("assets/YoungSerif-Regular.ttf");font-weight:400;font-display:swap}@font-face{font-family:"Rozha One";src:url("assets/RozhaOne-Regular.ttf");font-weight:400;font-display:swap}@font-face{font-family:"Gilda Display";src:url("assets/GildaDisplay-Regular.ttf");font-weight:400;font-display:swap}@font-face{font-family:"Anton";src:url("assets/Anton-Regular.ttf");font-weight:400;font-display:swap}@font-face{font-family:"Gloock";src:url("assets/Gloock-Regular.ttf");font-weight:400;font-display:swap}@font-face{font-family:"Familjen Grotesk";src:url("assets/FamiljenGroteskwght.ttf");font-weight:400 700;font-display:swap}@font-face{font-family:"Fragment Mono";src:url("assets/FragmentMono-Regular.ttf");font-weight:400;font-display:swap}
:root{--ink:#F4F1EA;--muted:#F4F1EAb3;--line:#ffffff2e;--chip:#00000033;--on:#F4F1EA;--onink:#11212D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#11212D;color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif}
body.sizes{--ink:#11212D;--muted:#11212Dbf;--line:#11212D26;--chip:#ffffffa6;--on:#11212D;--onink:#fff}
body.light{--ink:#11212D;--muted:#11212Dbf;--line:#11212D26;--chip:#ffffff66;--on:#11212D;--onink:#fff}
#bd{position:fixed;left:0;top:0;transform-origin:0 0;will-change:transform;opacity:0;transition:opacity .8s ease}
#bd.on{opacity:1}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;transition:opacity .45s ease}#c.out,#bd.out{opacity:0!important}#bd{transition:opacity .45s ease}#studio{position:fixed;inset:0;opacity:0;transition:opacity .6s ease;pointer-events:none}body.sizes #studio{opacity:1}#studio:before{content:'';position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 42%,var(--glow,#ffffff) 0%,transparent 70%)}#studio:after{content:'';position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(180deg,transparent,rgba(17,33,45,.10))}#mark3d{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);font-size:min(17vw,240px);line-height:1;white-space:nowrap;opacity:0;color:var(--ink);pointer-events:none;transition:opacity .6s ease;letter-spacing:-.02em}body.sizes #mark3d{opacity:.06}
.shade{position:fixed;inset:0;pointer-events:none;transition:background .8s}
body:not(.light) .shade{background:linear-gradient(90deg,#0b0d10d9 0%,#0b0d1099 26%,#0b0d1000 52%),linear-gradient(0deg,#0b0d10a6 0%,#0b0d1000 28%)}
body.light .shade{background:linear-gradient(90deg,#f4f1eae6 0%,#f4f1ea99 26%,#f4f1ea00 50%)}
body.sizes .shade{background:none}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.bars:before,.bars:after{content:"";position:fixed;left:0;right:0;height:3.2vh;background:#07090b;z-index:2;pointer-events:none}
.bars:before{top:0}.bars:after{bottom:0}
header{position:fixed;left:44px;right:44px;top:calc(3.2vh + 18px);display:flex;justify-content:space-between;align-items:center;z-index:3}
.mark{font:700 11px "Hanken Grotesk";letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;gap:8px}
button{font:700 12.5px "Hanken Grotesk";border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:10px 16px;border-radius:999px;cursor:pointer;backdrop-filter:blur(10px);transition:transform .15s,background .2s}
button:hover{transform:translateY(-1px)}button:active{transform:scale(.97)}
button.on{background:var(--on);color:var(--onink);border-color:var(--on)}
#story{position:fixed;left:44px;bottom:calc(3.2vh + 40px);width:min(430px,38vw);z-index:3}
#story>*{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease}
#story.in>*{opacity:1;transform:none}
#story.in>*:nth-child(2){transition-delay:.06s}#story.in>*:nth-child(3){transition-delay:.12s}#story.in>*:nth-child(4){transition-delay:.18s}
#story.in>*:nth-child(5){transition-delay:.24s}#story.in>*:nth-child(6){transition-delay:.3s}#story.in>*:nth-child(7){transition-delay:.36s}
.chap{font:700 11px "Hanken Grotesk";letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.bn{font-size:62px;line-height:.98;margin:12px 0 14px;letter-spacing:.01em}
.vision{font:400 21px/1.34 "Young Serif";max-width:30ch}
.voice{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.voice span{font:700 11px "Hanken Grotesk";letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);padding:7px 11px;border-radius:999px}
.pal{display:flex;gap:0;margin-top:20px;border-radius:10px;overflow:hidden;width:min(320px,100%);height:38px;box-shadow:0 10px 30px -14px #0008}
.pal i{flex:1;position:relative}
.pal i:after{content:attr(data-h);position:absolute;left:6px;bottom:4px;font:600 9px "Fragment Mono";color:#fff;mix-blend-mode:difference;opacity:.85}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-top:20px;font-size:13px;line-height:1.45}
.meta b{font:700 10.5px "Hanken Grotesk";letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding-top:2px}
nav{position:fixed;right:44px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:3;align-items:flex-end}
nav button{background:none;border:0;padding:6px 0;font:700 12px "Hanken Grotesk";letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;backdrop-filter:none}
nav button:after{content:"";width:22px;height:1.5px;background:currentColor;transition:width .3s}
nav button.on{color:var(--ink);background:none}nav button.on:after{width:46px}
.arrows{position:fixed;right:44px;bottom:calc(3.2vh + 40px);display:flex;gap:8px;z-index:3}
.arrows button{width:46px;height:46px;padding:0;font-size:18px}
.disc{position:fixed;left:44px;right:44px;bottom:calc(3.2vh + 12px);font:500 10.5px "Hanken Grotesk";color:var(--muted);z-index:3;text-align:right}
#load{position:fixed;inset:0;display:grid;place-items:center;font:700 11px "Hanken Grotesk";letter-spacing:.3em;color:#F4F1EA99;z-index:5;background:#11212D;transition:opacity .6s}
#sizes{position:fixed;left:44px;bottom:calc(3.2vh + 40px);display:none;z-index:3;flex-direction:column;gap:10px}
body.sizes #sizes{display:flex}body.sizes #story,body.sizes nav{display:none}
#sizes .row{display:flex;gap:8px;flex-wrap:wrap;max-width:min(980px,calc(100vw - 150px))}#szItems button:not(.on){background:#ffffffcc;color:#11212D}body.sizes .disc b{display:none}
body.bare #story,body.bare .shade{display:none}body.clean header,body.clean nav,body.clean .arrows,body.clean .disc,body.clean #sizes{display:none}
@media (max-width:820px){.bn{font-size:40px}.vision{font-size:16px}#story{width:auto;right:24px;left:24px;bottom:calc(3.2vh + 74px)}nav{display:none}.meta,.pal{display:none}
 header{left:20px;right:20px}.arrows{right:20px;bottom:calc(3.2vh + 16px)}.disc{display:none}

/* ── the brand card: a frosted editorial plate ── */
#story{width:min(470px,40vw);padding:26px 28px 24px;border-radius:22px;background:rgba(12,13,16,.46);border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15);box-shadow:0 40px 80px -40px rgba(0,0,0,.65)}
body.light #story{background:rgba(250,248,244,.62);border-color:rgba(17,33,45,.12);box-shadow:0 40px 80px -40px rgba(17,33,45,.35)}
body:not(.light) .shade{background:linear-gradient(90deg,#0b0d1066 0%,#0b0d1000 45%),linear-gradient(0deg,#0b0d1080 0%,#0b0d1000 30%)}
body.light .shade{background:linear-gradient(90deg,#f4f1ea55 0%,#f4f1ea00 45%)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.num{font:800 64px/0.8 "Hanken Grotesk";letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.2px var(--acc);opacity:.95}
.ind{font:700 10.5px "Hanken Grotesk";letter-spacing:.26em;text-transform:uppercase;color:var(--muted);text-align:right;padding-top:6px}
.ind i{display:block;font-style:normal;margin-top:6px;color:var(--acc)}
#story .bn{font-size:54px;margin:14px 0 12px}
.quote{position:relative;font:400 19px/1.38 "Young Serif";padding-left:16px;border-left:2px solid var(--acc);max-width:34ch}
.tone{margin-top:14px;font:700 10.5px "Hanken Grotesk";letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.tone b{color:var(--ink);font-weight:800}
.grid2{display:grid;grid-template-columns:88px 1fr;gap:18px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.spec{display:flex;flex-direction:column;justify-content:space-between}
.spec .aa{font-size:58px;line-height:.9}
.spec small{font:600 9.5px "Hanken Grotesk";letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px;line-height:1.35}
.strips{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.strip i{display:block;height:54px;border-radius:9px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 10px 18px -12px rgba(0,0,0,.6)}
.strip b{display:block;margin-top:7px;font:700 9px "Hanken Grotesk";letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.strip span{display:block;margin-top:2px;font:500 9.5px "Fragment Mono";color:var(--muted)}
.rng{margin-top:16px;font:500 12px/1.5 "Hanken Grotesk";color:var(--muted)}
.rng b{color:var(--ink);font-weight:700}
@media (max-width:820px){#story{width:auto;padding:18px 18px 16px}.num{font-size:44px}#story .bn{font-size:36px}.quote{font-size:15px}.grid2,.rng{display:none}}

function ui(){
  const i=ORDER.indexOf(st.brand),S0=STORIES[st.brand],el=document.getElementById('story');el.classList.remove('in');
  const pal=[['Primary',S0.primary],['Second',S0.secondary],['Accent',S0.accent],['Ink',S0.ink],['Paper',S0.paper]];
  const wf=S0.word_font,bold=wf==='Familjen Grotesk'?';font-weight:700;letter-spacing:-.03em':'';
  const nPacks=ITEMS.filter(x=>x.brand===st.brand).length;
  el.style.setProperty('--acc',S0.stage.tone==='light'?S0.primary:(['kora'].includes(st.brand)?'#d8d2c7':S0.accent));
  el.innerHTML=`<div class="card-top"><div class="num">${String(i+1).padStart(2,'0')}</div><div class="ind">${S0.industry}<i>${i+1} of ${ORDER.length}</i></div></div>
   <h1 class="bn" style="font-family:'${wf}'${bold}">${S0.name}</h1>
   <p class="quote">${S0.vision}</p>
   <p class="tone">Voice &nbsp;${S0.voice.map(v=>`<b>${v}</b>`).join(' · ')}</p>
   <div class="grid2"><div class="spec"><div class="aa" style="font-family:'${wf}'${bold}">Aa</div><small>${S0.fonts[0].split(' · ')[0]}<br>${(S0.fonts[1]||'').split(' · ')[0]}</small></div>
   <div class="strips">${pal.map(([n,h])=>`<div class="strip"><i style="background:${h}"></i><b>${n}</b><span>${h.toUpperCase()}</span></div>`).join('')}</div></div>
   <p class="rng"><b>${nPacks} print-ready packs</b> · ${S0.device}</p>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));
  document.getElementById('nav').innerHTML=ORDER.map(b=>`<button data-b="${b}" class="${b===st.brand?'on':''}">${STORIES[b].name}</button>`).join('');
  document.getElementById('mStory').classList.toggle('on',st.mode==='story');document.getElementById('mSizes').classList.toggle('on',st.mode==='sizes');document.getElementById('mOne').classList.toggle('on',st.mode==='one');document.getElementById('spin').classList.toggle('on',st.spin);
  document.getElementById('szTitle').textContent=st.mode==='one'?`${S0.name} · ${shortName(BY[st.key])} · drag to turn it all the way round`:`${S0.name} · every size · pick one to inspect it`;
  document.getElementById('szLines').innerHTML=ORDER.filter(b=>STORIES[b].sizes.length).map(b=>STORIES[b].sizes.map(l=>`<button data-b="${b}" data-l="${l}" class="${st.mode==='sizes'&&b===st.brand&&l===st.line?'on':''}">${l==='kokum-'?'Monsoon Kokum':l==='jeera-'?'Monsoon Jeera':STORIES[b].name}</button>`).join('')).join('');
  const packs=st.mode==='one'?ITEMS.filter(x=>x.brand===st.brand):ITEMS.filter(x=>x.brand===st.brand&&st.line&&x.key.startsWith(st.line)&&(!x.faces||!ITEMS.some(j=>j.brand===st.brand&&!j.faces)));
  document.getElementById('szItems').innerHTML=packs.map(x=>`<button data-k="${x.key}" class="${st.mode==='one'&&x.key===st.key?'on':''}">${shortName(x)}</button>`).join('');
  ctl.autoRotate=st.spin&&st.mode!=='story';history.replaceState(null,'','#brand='+st.brand+'&mode='+st.mode+(st.line?'&line='+st.line:'')+(st.mode==='one'?'&size='+st.key:''));
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.k){st.key=b.dataset.k;st.brand=BY[st.key].brand;st.mode='one';show();}
  else if(b.dataset.l){st.brand=b.dataset.b;st.line=b.dataset.l;st.mode='sizes';show();}else if(b.dataset.b){st.brand=b.dataset.b;show();}
  else if(b.id==='mStory'){st.mode='story';show();}else if(b.id==='mSizes'){st.mode='sizes';if(!STORIES[st.brand].sizes.length)st.brand='chai';st.line=null;show();}
  else if(b.id==='mOne'){st.mode='one';if(!BY[st.key]||BY[st.key].brand!==st.brand)st.key=(STORIES[st.brand].comp[0]||{}).k;show();}
  else if(b.id==='spin'){st.spin=!st.spin;ui();}else if(b.id==='prev'||b.id==='next'){const pool=st.mode==='sizes'?ORDER.filter(x=>STORIES[x].sizes.length):ORDER;
    const i=pool.indexOf(st.brand);st.brand=pool[(i+(b.id==='next'?1:-1)+pool.length)%pool.length];st.line=null;if(st.mode==='one')st.key=(STORIES[st.brand].comp[0]||{}).k;show();}
  else if(b.id==='save'){const c2=document.createElement('canvas');c2.width=canvas.width;c2.height=canvas.height;const g=c2.getContext('2d');
    if(st.mode==='story'&&bd.naturalWidth){const r=bd.getBoundingClientRect(),k=canvas.width/innerWidth;g.drawImage(bd,r.left*k,r.top*k,r.width*k,r.height*k);}else{g.fillStyle=STORIES[st.brand].paper;g.fillRect(0,0,c2.width,c2.height);}
    g.drawImage(canvas,0,0);const a=document.createElement('a');a.href=c2.toDataURL('image/png');a.download=`${st.brand}-${st.mode}.png`;a.click();}});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click();});
// brand stories: dragging turns the whole set on a turntable (full 360, with a little momentum); a click without dragging opens that pack on its own
let drag=null;const ray=new THREE.Raycaster();
canvas.addEventListener('pointerdown',e=>{if(st.mode!=='story')return;drag={x:e.clientX,x0:e.clientX,y0:e.clientY};spinV=0;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;drag.x=e.clientX;root.rotation.y+=dx*.008;spinV=dx*.008;});
canvas.addEventListener('pointerup',e=>{if(!drag)return;const moved=Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0);drag=null;
  if(moved<6){const r=canvas.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),cam);
    const hit=ray.intersectObjects(root.children,true)[0];if(hit){let o=hit.object;while(o&&!o.userData.key)o=o.parent;if(o){st.key=o.userData.key;st.mode='one';show();}}}});
canvas.style.touchAction='none';
function size(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',()=>{size();fit();});size();
const clock=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime();
  floaters.forEach(f=>{f.o.position.y=f.y+Math.sin(t*.9+f.ph)*5;f.o.rotation.y+=.0015;});
  if(st.mode==='story'&&!drag){if(st.spin)root.rotation.y+=.004;else if(Math.abs(spinV)>1e-4){root.rotation.y+=spinV;spinV*=.94;}}
  ctl.update();R.render(scene,cam);})();
show().then(()=>{setTimeout(()=>ORDER.forEach(b=>{const i=new Image();i.src=STORIES[b].bd;STORIES[b].comp.forEach(c=>BY[c.k]&&loadImg(BY[c.k].img));}),1500);});
</script></body></html>
